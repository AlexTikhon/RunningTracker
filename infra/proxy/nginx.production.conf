user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # This proxy is the public edge. Do not enable real_ip from arbitrary headers.
  limit_req_zone $binary_remote_addr zone=oidc_login:1m rate=5r/m;

  # Logs go to the container's stdout/stderr, where the runtime's log driver bounds them.
  log_format proxy '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr request_time=$request_time';
  access_log /dev/stdout proxy;

  # Rendered from /etc/nginx/templates/site.conf.template by the image's entrypoint.
  include /etc/nginx/conf.d/*.conf;
}
