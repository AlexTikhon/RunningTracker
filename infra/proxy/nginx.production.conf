user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# nginx's stderr is the error-log boundary's private FIFO (ADR-0062), never the container's: an error entry quotes
# the request line, upstream URI and referrer, query string included. Every error_log must stay `stderr`.
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # This proxy is the public edge. Do not enable real_ip from arbitrary headers.
  limit_req_zone $binary_remote_addr zone=oidc_login:1m rate=5r/m;

  # The access log goes to the container's stdout and the sanitized error log to its stderr, where the runtime's
  # log driver bounds them.
  # The OIDC callback carries a one-time code and state in its query string, so the request line is never logged:
  # the path is the raw request URI cut at the first "?" (kept across internal redirects, unlike $uri).
  map $request_uri $log_request_path {
    default "-";
    "~^(?<log_path>[^?]*)" $log_path;
  }

  # connection= is the number an error entry carries as *N, so the two logs can be joined without a query.
  log_format proxy '$remote_addr - $host [$time_local] "$request_method $log_request_path $server_protocol" '
                   '$status $body_bytes_sent upstream=$upstream_addr request_time=$request_time connection=$connection';
  access_log /dev/stdout proxy;

  # Rendered from /etc/nginx/templates/site.conf.template by the image's entrypoint.
  include /etc/nginx/conf.d/*.conf;
}
