user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  log_format proxy '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr request_time=$request_time';
  access_log /var/log/nginx/access.log proxy;

  upstream running_tracker_api {
    server api:3000;
    keepalive 16;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/tls/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:TLS:1m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;

    location ~ ^/api/orgs/[^/]+/live/?$ {
      proxy_pass http://running_tracker_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 75s;
      send_timeout 30s;

      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_next_upstream off;
      gzip off;
      proxy_pass_header X-Accel-Buffering;
    }

    location /api/ {
      proxy_pass http://running_tracker_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
      proxy_cache off;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
