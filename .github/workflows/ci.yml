name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a branch without an open pull request run the workflow on a GitHub-hosted runner.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
        env:
          POSTGRES_DB: running_tracker_test
          POSTGRES_PASSWORD: running_tracker_local
          POSTGRES_USER: running_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U running_tracker -d running_tracker_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://running_tracker_runtime:runtime_local_only@127.0.0.1:5432/running_tracker_main_must_not_be_used
      TEST_BOOTSTRAP_DATABASE_URL: postgresql://running_tracker:running_tracker_local@127.0.0.1:5432/running_tracker_test
      TEST_DATABASE_URL: postgresql://running_tracker_runtime:runtime_local_only@127.0.0.1:5432/running_tracker_test
      TEST_MAINTENANCE_DATABASE_URL: postgresql://running_tracker_maintenance:maintenance_local_only@127.0.0.1:5432/running_tracker_test
      TEST_MIGRATION_DATABASE_URL: postgresql://running_tracker_owner:owner_local_only@127.0.0.1:5432/running_tracker_test
      DB_CONNECTION_TIMEOUT_MS: 2000
      DB_QUERY_TIMEOUT_MS: 1000
      SHUTDOWN_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24.11.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:bootstrap:test
      - run: npm run db:migrate:test
      - run: npm run test:integration

  # Real-browser suite (tests/e2e). A separate job with its own database service: it must never share
  # running_tracker_test with the integration tests above, and the slow browser run must not delay verify.
  # Each matrix entry is its own runner with its own database service, installs only its browser, and runs a script
  # that selects only that browser's projects.
  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole suite: the chromium and chromium-oidc projects, with the real Mapbox runtime smoke.
          - browser: chromium
            project: chromium
            script: test:e2e
            timeout-minutes: 20
          # The bounded Firefox gate: 18 core tests (firefox-core in tests/e2e/playwright.config.ts).
          - browser: firefox
            project: firefox-core
            script: test:e2e:firefox
            timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
        env:
          POSTGRES_DB: running_tracker_test
          POSTGRES_PASSWORD: running_tracker_local
          POSTGRES_USER: running_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U running_tracker -d running_tracker_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://running_tracker_runtime:runtime_local_only@127.0.0.1:5432/running_tracker_main_must_not_be_used
      TEST_BOOTSTRAP_DATABASE_URL: postgresql://running_tracker:running_tracker_local@127.0.0.1:5432/running_tracker_test
      TEST_DATABASE_URL: postgresql://running_tracker_runtime:runtime_local_only@127.0.0.1:5432/running_tracker_test
      TEST_MAINTENANCE_DATABASE_URL: postgresql://running_tracker_maintenance:maintenance_local_only@127.0.0.1:5432/running_tracker_test
      TEST_MIGRATION_DATABASE_URL: postgresql://running_tracker_owner:owner_local_only@127.0.0.1:5432/running_tracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24.11.1
      - run: npm ci
      # The API and the web app import the built contracts and fixtures packages; dist/ is not committed.
      - run: npm run build
      - run: npm run db:bootstrap:test
      - run: npm run db:migrate:test
      # The browser build pinned by the installed @playwright/test, with its system libraries.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/e2e
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
