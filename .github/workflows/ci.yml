name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
        env:
          POSTGRES_DB: running_tracker_test
          POSTGRES_PASSWORD: running_tracker_local
          POSTGRES_USER: running_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U running_tracker -d running_tracker_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://running_tracker:running_tracker_local@127.0.0.1:5432/running_tracker_test
      TEST_DATABASE_URL: postgresql://running_tracker:running_tracker_local@127.0.0.1:5432/running_tracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24.11.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate:test
      - run: npm run test:integration

